name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    # Keep the suite green on Linux as well as Windows. The engine is
    # cross-platform by design; running both keeps path, file-sharing and
    # console assumptions honest, and is the prerequisite for adding an
    # arm64 runner.
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      # Build SharpMind.Core first on purpose: SharpMind.Tests.csproj embeds
      # SharpMind.Core.dll through an Exists() condition that MSBuild evaluates
      # before the test project is built. On a clean checkout the DLL is absent,
      # the embedded resource would be skipped, and the PluginAssemblyResolver
      # tests would fail. The test project is built directly (not via
      # SharpMind.sln) because the solution also contains Setup .vdproj projects
      # that the dotnet CLI cannot build.
      - name: Build SharpMind.Core
        run: dotnet build SharpMind.Core/SharpMind.Core.csproj -c Release

      - name: Test
        run: dotnet test SharpMind.Tests/SharpMind.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
