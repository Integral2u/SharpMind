name: Deploy SharpMind.Live to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'SharpMind.Live/**'
      - 'SharpMind.Core/**'
      - 'SharpMind.Model/**'
      - 'SharpMind.Inference/**'
      - 'SharpMind.Tokenization/**'
      - 'SharpMind.Data/**'
      - '.github/workflows/deploy-pages.yml'
  # A change to this workflow is a change to the only thing that publishes the
  # site, so build it on the PR. The deploy job is skipped for pull requests: it
  # would publish the PR's output over the live site.
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'SharpMind.Live/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The hosted runner's default SDK is now 11.0.x, and `dotnet publish` picks
      # the highest SDK on the machine even when setup-dotnet added an older one to
      # PATH. For a net10.0 wasm target that means the SDK 11 workload id, not the
      # bare `wasm-tools` (which installs for the SDK doing the install). Pinning
      # alone did not help: the build still ran on 11.0.100 and failed with
      # NETSDK1147 "wasm-tools-net10" missing.
      - name: Install wasm-tools workload
        run: |
          dotnet --list-sdks
          dotnet workload install wasm-tools-net10

      - name: Publish (AOT)
        run: dotnet publish SharpMind.Live/SharpMind.Live.csproj -c Release -o publish_out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish_out/wwwroot

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4