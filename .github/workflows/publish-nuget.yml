name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish from (tag or branch). The version is read from Directory.Build.props at this ref.'
        required: false
        default: 'master'
      run_tests:
        description: 'Run the full Release test suite before publishing'
        required: false
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The projects are built directly (not via SharpMind.sln) because the
      # solution also contains Setup .vdproj projects that the dotnet CLI cannot
      # build. Build order is the NuGet dependency order so every package is
      # publishable as soon as its turn to push comes. Building Core first also
      # satisfies SharpMind.Tests.csproj's Embed existence check, which runs
      # before the test project itself is built.
      - name: Build packages (Release)
        run: |
          $projects = @('SharpMind.Core','SharpMind.Data','SharpMind.Data.Parquet','SharpMind.Tokenization','SharpMind.Model','SharpMind.Inference','SharpMind.Training','SharpMind.Extensions.Tools','SharpMind.Extensions.AI','SharpMind.Server','SharpMind.GPU')
          foreach ($id in $projects) {
            dotnet build "$id/$id.csproj" -c Release --nologo
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $id" }
          }

      - name: Test (Release)
        if: inputs.run_tests
        run: |
          dotnet test SharpMind.Tests/SharpMind.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Pack
        run: |
          $projects = @('SharpMind.Core','SharpMind.Data','SharpMind.Data.Parquet','SharpMind.Tokenization','SharpMind.Model','SharpMind.Inference','SharpMind.Training','SharpMind.Extensions.Tools','SharpMind.Extensions.AI','SharpMind.Server','SharpMind.GPU')
          $out = Join-Path $env:GITHUB_WORKSPACE 'nupkg'
          foreach ($id in $projects) {
            dotnet pack "$id/$id.csproj" -c Release --no-build --nologo -o $out
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $id" }
          }

      # Acquire the GitHub Actions OIDC token scoped to this repo/workflow
      # (audience api.nuget.org) registered under Trusted Signing on nuget.org.
      # Fetched from the runner's ID-token endpoint directly instead of via a
      # Node action: actions/github-script ran on the deprecated Node 20 runtime
      # and was blocked by GitHub.
      - name: Get OIDC token
        id: oidc
        shell: pwsh
        run: |
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.nuget.org"
          $headers = @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $token = (Invoke-RestMethod -Uri $uri -Headers $headers).value
          Add-Content -Path $env:GITHUB_OUTPUT -Value "token=$token"

      - name: Push to NuGet.org
        env:
          NUGET_PUBLISH_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          $nupkgDir = Join-Path $env:GITHUB_WORKSPACE 'nupkg'
          # NuGet normalizes the version in the produced file name (1.0.6.0
          # becomes 1.0.6), so the produced file is resolved by package id from
          # the actual file name instead of being reconstructed from a literal
          # version string.
          $files = Get-ChildItem -LiteralPath $nupkgDir -Filter '*.nupkg' | ForEach-Object {
            [PSCustomObject]@{ Id = $_.BaseName -replace '\.\d+(\.\d+)*$', ''; File = $_ }
          }
          $projects = @('SharpMind.Core','SharpMind.Data','SharpMind.Data.Parquet','SharpMind.Tokenization','SharpMind.Model','SharpMind.Inference','SharpMind.Training','SharpMind.Extensions.Tools','SharpMind.Extensions.AI','SharpMind.Server','SharpMind.GPU')
          $source = 'https://api.nuget.org/v3/index.json'
          foreach ($id in $projects) {
            $match = $files | Where-Object { $_.Id -eq $id } | Select-Object -First 1
            if ($null -eq $match) { throw "Package not produced for $id in $nupkgDir" }
            dotnet nuget push $match.File.FullName --api-key $env:NUGET_PUBLISH_TOKEN --source $source --skip-duplicate --nologo
            if ($LASTEXITCODE -ne 0) { throw "Push failed: $($match.File.FullName)" }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- $($match.File.BaseName)" -Encoding utf8
          }

      - name: Archive packages
        uses: actions/upload-artifact@v4
        with:
          name: SharpMind-nupkgs
          path: nupkg/*.nupkg
          if-no-files-found: error